# Local Postgres for Travel Manager development.
# Mirrors the Supabase Postgres version (16) so schema/data behave the same.
#
#   docker compose up -d        # start
#   docker compose down         # stop (keeps data)
#   docker compose down -v      # stop and WIPE data
#
# App/Prisma connect with:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/travelmanager
#   DIRECT_URL=postgresql://postgres:postgres@localhost:5432/travelmanager
services:
  db:
    image: postgres:16
    container_name: travelmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelmanager
    ports:
      - "5432:5432"
    volumes:
      - travelmanager-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travelmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travelmanager-pgdata:
